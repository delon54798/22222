<!DOCTYPE html>
<html>
<head>
    <title>Kalkulator Sederhana</title>
    <style>
        .box {
            border: 1px solid #000;
            padding: 15px;
            width: 320px;
            font-family: sans-serif;
            position: fixed;
        }
        .row {
            margin-bottom: 8px;
        }
        label {
            display: inline-block;
            width: 130px;
        }
        button {
            width: 35px;
            height: 30px;
            margin-right: 3px;
        }
    </style>
</head>
<body>

    <div class="box">
        <div class="row">
            <label>Input Bilangan 1</label>
            <input type="number" id="bil1" value="9">
        </div>
        <div class="row">
            <label>Input Bilangan 2</label>
            <input type="number" id="bil2" value="3">
        </div>
        <div class="row">
            <label></label>
            <button onclick="hitung('+')">+</button>
            <button onclick="hitung('-')">-</button>
            <button onclick="hitung('*')">x</button>
            <button onclick="hitung('/')">/</button>
        </div>
        <div class="row">
            <label>Output</label>
            <input type="text" id="hasil" readonly>
        </div>
    </div>

    <script>
        function hitung(op) {
            let a = parseFloat(document.getElementById('bil1').value);
            let b = parseFloat(document.getElementById('bil2').value);
            let hasil = 0;

            if (op === '+') hasil = a + b;
            if (op === '-') hasil = a - b;
            if (op === '*') hasil = a * b;
            if (op === '/') hasil = a / b;

            document.getElementById('hasil').value = hasil;
        }
    </script>

</body>
</html>
